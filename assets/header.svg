<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity=".35"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="240" rx="14"/></clipPath>
  </defs>
  <style>
    .mono{font:600 18px Consolas,'SF Mono','Courier New',monospace;fill:#3fb950}
    .name{font:800 54px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#f0f6fc}
    .role{font:500 20px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#8b949e}
    .deco{font:700 150px Consolas,'Courier New',monospace;fill:#58a6ff;fill-opacity:.07}
    .f1,.f2,.f3{opacity:0;animation:in .9s ease-out forwards}
    .f1{animation-delay:.1s}.f2{animation-delay:.4s}.f3{animation-delay:.7s}
    .cursor{animation:blink 1s step-end infinite}
    .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1s ease-out 1s forwards}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes grow{to{transform:scaleX(1)}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <rect width="1200" height="240" fill="url(#grid)"/>
    <rect width="1200" height="240" fill="url(#glow)"/>
    <rect width="1199" height="239" x=".5" y=".5" rx="14" fill="none" stroke="#30363d"/>
    <text class="deco" x="1120" y="175" text-anchor="end">&lt;/&gt;</text>
    <g class="f1">
      <text class="mono" x="80" y="78">$ whoami</text>
      <rect class="cursor" x="172" y="62" width="10" height="20" fill="#3fb950"/>
    </g>
    <text class="name f2" x="80" y="140">Redeemer Aparece</text>
    <text class="role f3" x="80" y="178">BS Information Technology Student </text>
    <rect class="bar" x="80" y="198" width="160" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
